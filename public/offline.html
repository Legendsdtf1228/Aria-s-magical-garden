<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7ec86a" />
    <title>Aria's Color Garden — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: #3f3554;
        background: linear-gradient(180deg, #bfe9f8, #e8f7c8 55%, #f6efd0);
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #fffffff2;
        border: 5px solid white;
        border-radius: 32px;
        padding: 28px 22px;
        max-width: 420px;
        box-shadow: 0 16px 0 #4b564928;
      }
      h1 {
        margin: 8px 0 12px;
        font-size: 28px;
        line-height: 1.1;
      }
      h1 span {
        color: #f26473;
      }
      p {
        font-weight: 700;
        line-height: 1.45;
        color: #746a81;
      }
      .flower {
        font-size: 56px;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 14px 24px;
        border-radius: 999px;
        background: linear-gradient(#ff7883, #ed4f63);
        color: white;
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 6px 0 #bd3548;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <div class="flower" aria-hidden="true">🌼</div>
      <h1>The garden is<br /><span>resting</span></h1>
      <p>
        This part of the garden isn’t saved on this device yet.<br />
        Connect to the internet once, open the game, then you can play offline.
      </p>
      <p>Esta parte del jardín aún no está guardada. Conéctate una vez y vuelve a abrir el juego.</p>
      <a href="/">Try again • Intentar de nuevo</a>
    </section>
  </body>
</html>
